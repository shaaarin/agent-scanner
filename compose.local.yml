# Local web development: docker compose -f compose.local.yml up -d --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent_scanner
      POSTGRES_PASSWORD: agent_scanner
      POSTGRES_DB: agent_scanner
    volumes:
      - control-api-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_scanner -d agent_scanner"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  control-api:
    build: ./control-api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./library:/library:ro
      - ./control-api/app/migrations/versions:/srv/app/migrations/versions
    environment:
      DATABASE_URL: postgresql+psycopg://agent_scanner:agent_scanner@postgres:5432/agent_scanner
      DEMO_SESSION_ID: demo-session-1
      LIBRARY_DIR: /library
      SCANNER_DEEPTEAM_URL: http://scanner-deepteam:8000
      SCANNER_PYRIT_URL: http://scanner-pyrit:8000
      SCANNER_MCP_URL: http://scanner-mcp:8000
      SCANNER_PROMPTFOO_URL: http://scanner-promptfoo:8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 2s
    restart: unless-stopped
  web:
    build:
      context: ./web
      args:
        VITE_CONTROL_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      control-api:
        condition: service_healthy
    restart: unless-stopped
  scanner-mcp:
    build: ./scanner/mcp
    image: agent-scanner-scanner-mcp:latest
    environment:
      CONTROL_API_URL: http://control-api:8000
    depends_on:
      control-api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
  scanner-mcp-cisco-yara:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: cisco_yara
      CONTROL_API_URL: http://control-api:8000
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  scanner-mcp-cisco-readiness:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: cisco_readiness
      CONTROL_API_URL: http://control-api:8000
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
