  mcp-test-target:
    image: agent-scanner-scanner-mcp:latest
    command: ["python", "/test/test_server.py"]
    profiles: [test]
    volumes:
      - ./scanner/mcp/examples:/test:ro
    init: true
    cap_drop: [ALL]
