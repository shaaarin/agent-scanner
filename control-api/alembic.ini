# Alembic config for running the CLI inside the control-api container, e.g.
#   docker compose exec control-api alembic revision -m "add foo"
#   docker compose exec control-api alembic upgrade head
# The SQLAlchemy URL is left blank on purpose -- app/migrations/env.py fills it
# in from CONTROL_API_DB_PATH, the same source the app itself uses.
[alembic]
script_location = app/migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
