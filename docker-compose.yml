services:
  control-api:
    build: ./control-api
    ports:
      - "8000:8000"
    volumes:
      - control-api-data:/data
      # Local Markdown knowledge library: drop .md files in and they show up
      # in the UI immediately, no rebuild -- see control-api/app/api/library.py.
      - ./library:/library:ro
      # New Alembic revisions generated in-container (`alembic revision ...`)
      # land on the host so they survive a restart and can be committed.
      - ./control-api/app/migrations/versions:/srv/app/migrations/versions
    environment:
      CONTROL_API_DB_PATH: /data/control-api.db
      DEMO_SESSION_ID: demo-session-1
      SEED_DEMO_DATA: "true"
      # Сканер выбирается по типу скана, см. control-api/app/api/scans.py.
      SCANNER_DEEPTEAM_URL: http://scanner-deepteam:8000
      SCANNER_MCP_URL: http://scanner-mcp:8000
      SCANNER_PROMPTFOO_URL: http://scanner-promptfoo:8000
      LIBRARY_DIR: /library
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 2s

  control-api-mitm-bridge:
    image: alpine/socat
    command: "TCP-LISTEN:8000,fork,reuseaddr TCP:control-api:8000"
    networks:
      - default
      - kind
    depends_on:
      control-api:
        condition: service_healthy

  proxy:
    build: ./proxy
    ports:
      - "8100:8080"
    environment:
      CONTROL_API_URL: http://control-api:8000
      SESSION_ID: demo-session-1
      MITM_MODE: regular
      MITM_LISTEN_PORT: "8080"
    volumes:
      - mitm-dev-ca:/tmp/mitm-confdir
    depends_on:
      control-api:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_CONTROL_API_URL: http://localhost:8000
        VITE_LAUNCHER_URL: http://localhost:8400
    ports:
      - "4173:4173"
    depends_on:
      - control-api

  # Сканеры: каждый тип скана -- отдельный сервис из scanner/<имя>
  # с одинаковым контрактом (POST /run/{scan_id}).

  # Динамическое тестирование (DeepTeam): поднимает агента через launcher.
  scanner-deepteam:
    build: ./scanner/deepteam
    environment:
      CONTROL_API_URL: http://control-api:8000
      LAUNCHER_URL: http://launcher:8000
    networks:
      - default
      # Needed to reach the tested agent's NodePort via the kind node's
      # container name, the same reason launcher is dual-homed.
      - kind
    depends_on:
      control-api:
        condition: service_healthy

  # Анализ кода (promptfoo code-scans): только клонирует репозиторий агента,
  # kind и launcher не нужны. Анализ выполняет облако Promptfoo.
  scanner-promptfoo:
    build: ./scanner/promptfoo
    environment:
      CONTROL_API_URL: http://control-api:8000
      PROMPTFOO_API_KEY: ${PROMPTFOO_API_KEY:-}
      # Свой сервер Promptfoo (Enterprise On-Prem); пусто -- облако Promptfoo.
      PROMPTFOO_CODE_SCAN_API_HOST: ${PROMPTFOO_CODE_SCAN_API_HOST:-}
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
      SCAN_CODE_TIMEOUT: "1800"
    depends_on:
      control-api:
        condition: service_healthy

  launcher:
    build: ./launcher
    environment:
      CONTROL_API_URL: http://control-api:8000
      MITM_CONTROL_API_URL: http://control-api-mitm-bridge:8000
      KUBECONFIG: /kubeconfig/config
      AGENT_IMAGE_REGISTRY: kind-registry:5000
      PROXY_IMAGE: kind-registry:5000/agent-scanner-proxy:latest
    volumes:
      - ./.kube-kind-config.yaml:/kubeconfig/config:ro
    networks:
      - default
      - kind
    depends_on:
      control-api:
        condition: service_healthy

  # launcher itself must stay dual-homed (default + kind, for k8s API access),
  # which makes ITS OWN host-published port flaky on this dev setup (see
  # CLAUDE.md) -- this single-homed bridge owns the host-published port
  # instead and forwards to launcher over the (reliable) default network,
  # the same "keep the thing the host actually hits off the flaky dual-homed
  # network" fix control-api-mitm-bridge already applies, just aimed at the
  # host side instead of the kind side.
  launcher-mitm-bridge:
    image: alpine/socat
    command: "TCP-LISTEN:8000,fork,reuseaddr TCP:launcher:8000"
    ports:
      - "8400:8000"
    depends_on:
      - launcher

  scanner-mcp:
    build: ./scanner/mcp
    image: agent-scanner-scanner-mcp:latest
    environment:
      CONTROL_API_URL: http://control-api:8000
    depends_on:
      control-api:
        condition: service_healthy
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2

  scanner-mcp-cisco-yara:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: cisco_yara
      CONTROL_API_URL: http://control-api:8000
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  scanner-mcp-cisco-readiness:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: cisco_readiness
      CONTROL_API_URL: http://control-api:8000
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  scanner-mcp-cisco-prompt-defense:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: cisco_prompt_defense
      CONTROL_API_URL: http://control-api:8000
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  scanner-mcp-snyk:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: snyk
      CONTROL_API_URL: http://control-api:8000
      SNYK_TOKEN: ${SNYK_TOKEN:-}
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  scanner-mcp-mcpradar:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: mcpradar
      CONTROL_API_URL: http://control-api:8000
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  scanner-mcp-semgrep:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: semgrep
      CONTROL_API_URL: http://control-api:8000
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  scanner-mcp-mcp-dynamic:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: mcp_dynamic
      CONTROL_API_URL: http://control-api:8000
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  default: {}
  kind:
    external: true
    name: kind

volumes:
  control-api-data:
  mitm-dev-ca:
