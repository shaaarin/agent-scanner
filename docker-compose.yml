services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: scanner
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-scanner-local}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - skill-queue-data:/var/lib/rabbitmq

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent_scanner
      POSTGRES_PASSWORD: agent_scanner
      POSTGRES_DB: agent_scanner
    volumes:
      - control-api-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_scanner -d agent_scanner"]
      interval: 2s
      timeout: 2s
      retries: 30

  control-api:
    build: ./control-api
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      # Local Markdown knowledge library: drop .md files in and they show up
      # in the UI immediately, no rebuild -- see control-api/app/api/library.py.
      - ./library:/library:ro
      # New Alembic revisions generated in-container (`alembic revision ...`)
      # land on the host so they survive a restart and can be committed.
      - ./control-api/app/migrations/versions:/srv/app/migrations/versions
    environment:
      DATABASE_URL: postgresql+psycopg://agent_scanner:agent_scanner@postgres:5432/agent_scanner
      DEMO_SESSION_ID: demo-session-1
      SEED_DEMO_DATA: "true"
      # Сканер выбирается по типу скана, см. control-api/app/api/scans.py.
      SCANNER_DEEPTEAM_URL: http://scanner-deepteam:8000
      SCANNER_PYRIT_URL: http://scanner-pyrit:8000
      SCANNER_MCP_URL: http://scanner-mcp:8000
      SCANNER_PROMPTFOO_URL: http://scanner-promptfoo:8000
      SCANNER_SEMGREP_URL: http://scanner-semgrep:8000
      SCANNER_INDIRECT_URL: http://scanner-indirect:8000
      SCANNER_SYSLEAK_URL: http://scanner-sysleak:8000
      RABBITMQ_URL: amqp://scanner:${RABBITMQ_PASSWORD:-scanner-local}@rabbitmq:5672/%2F
      SCANNER_SKILLS_URL: http://scanner-skills:8000
      LIBRARY_DIR: /library
      # Разбор репозитория в мастере конфигурации агента: control-api
      # проксирует запросы браузера на launcher по внутренней сети
      # (control-api/app/api/repo.py). Сам launcher порт не публикует.
      LAUNCHER_URL: http://launcher:8000
      # Авторизация по логину/паролю (docs/running-locally.md). Пустой
      # SESSION_SECRET_KEY = auth выключен, все эндпоинты открыты (dev).
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4173,http://localhost:5173}
      # Системный администратор создаётся при старте, если его ещё нет.
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Секрет машинного контура: одно значение из .env у control-api и всех
      # сервисов, которые в него ходят (сканеры, launcher, mitm-прокси).
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 2s
      # /health начинает отвечать только после init_db (alembic upgrade head).
      # На холодном старте -- свежий том postgres, все контейнеры стартуют
      # разом -- это дольше 6 секунд, и без start_period compose объявлял
      # контейнер unhealthy, обрывая запуск всех зависимых сервисов.
      start_period: 60s

  control-api-mitm-bridge:
    image: alpine/socat
    command: "TCP-LISTEN:8000,fork,reuseaddr TCP:control-api:8000"
    networks:
      - default
      - kind
    depends_on:
      control-api:
        condition: service_healthy

  proxy:
    build: ./proxy
    ports:
      - "8100:8080"
    environment:
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      SESSION_ID: demo-session-1
      MITM_MODE: regular
      MITM_LISTEN_PORT: "8080"
    volumes:
      - mitm-dev-ca:/tmp/mitm-confdir
    depends_on:
      control-api:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # Пусто: адрес API фронтенд выводит из адреса страницы (см.
        # web/src/api/client.ts), поэтому дашборд работает и при доступе по IP
        # стенда, и через SSH-туннель. Явное значение -- для нестандартной
        # раскладки портов.
        VITE_CONTROL_API_URL: ""
    ports:
      - "4173:4173"
    depends_on:
      - control-api

  # Сканеры: каждый тип скана -- отдельный сервис из scanner/<имя>
  # с одинаковым контрактом (POST /run/{scan_id}).

  # Динамическое тестирование (DeepTeam): поднимает агента через launcher.
  scanner-deepteam:
    build: ./scanner/deepteam
    environment:
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      LAUNCHER_URL: http://launcher:8000
    networks:
      - default
      # Needed to reach the tested agent's NodePort via the kind node's
      # container name, the same reason launcher is dual-homed.
      - kind
    depends_on:
      control-api:
        condition: service_healthy

  # Red teaming (PyRIT): поднимает агента через launcher и атакует его
  # целями PyRIT (одиночные промпты с конвертерами, RedTeaming, Crescendo).
  # Нужен kind (как scanner-deepteam).
  scanner-pyrit:
    build: ./scanner/pyrit
    environment:
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      LAUNCHER_URL: http://launcher:8000
    networks:
      - default
      - kind
    depends_on:
      control-api:
        condition: service_healthy

  # Анализ кода (promptfoo code-scans): только клонирует репозиторий агента,
  # kind и launcher не нужны. Анализ выполняет облако Promptfoo.
  scanner-promptfoo:
    build: ./scanner/promptfoo
    environment:
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      PROMPTFOO_API_KEY: ${PROMPTFOO_API_KEY:-}
      # Свой сервер Promptfoo (Enterprise On-Prem); пусто -- облако Promptfoo.
      PROMPTFOO_CODE_SCAN_API_HOST: ${PROMPTFOO_CODE_SCAN_API_HOST:-}
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
      SCAN_CODE_TIMEOUT: "1800"
    depends_on:
      control-api:
        condition: service_healthy

  # Анализ AI-кода (semgrep): клонирует репозиторий агента и прогоняет
  # локальный semgrep по правилам для LLM-кода. kind и launcher не нужны,
  # код никуда не отправляется.
  scanner-semgrep:
    build: ./scanner/semgrep
    environment:
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      SCAN_SEMGREP_TIMEOUT: "1800"
    depends_on:
      control-api:
        condition: service_healthy
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2

  # Анализ Agent Skills (SKILL.md): движки Cisco skill-scanner и NVIDIA
  # SkillSpector как подпроцессы в одном контейнере (D-43), вердикт считает
  # сам сервис. Без kind/launcher. Hardening -- как у воркеров scanner-mcp (D-41).
  scanner-skills:
    build: ./scanner/skills
    environment:
      RABBITMQ_URL: amqp://scanner:${RABBITMQ_PASSWORD:-scanner-local}@rabbitmq:5672/%2F
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      SCAN_MAX_CONCURRENT: "2"
      SCAN_ENGINE_TIMEOUT: "300"
      SCAN_TOTAL_TIMEOUT: "1800"
      SCAN_MAX_SKILLS: "50"
    depends_on:
      control-api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Косвенные инъекции: поднимает агента через launcher, отправляет ему
  # легитимную задачу и через прокси подкладывает инъекцию в результаты его
  # инструментов. Нужен kind (как scanner-deepteam).
  scanner-indirect:
    build: ./scanner/indirect
    environment:
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      LAUNCHER_URL: http://launcher:8000
      EXTRA_PAYLOADS_DIR: /payloads
    volumes:
      # Свои и сторонние наборы инъекций: YAML кладётся в payloads/indirect/
      # и подхватывается на лету, как библиотека знаний (пересборка не нужна).
      - ./payloads/indirect:/payloads:ro
    networks:
      - default
      - kind
    depends_on:
      control-api:
        condition: service_healthy

  # Утечка системного промпта: поднимает агента через launcher, вставляет
  # через прокси метку в системное сообщение и шлёт агенту атакующие промпты,
  # проверяя ответ на наличие метки. Нужен kind (как scanner-deepteam).
  scanner-sysleak:
    build: ./scanner/sysleak
    environment:
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      LAUNCHER_URL: http://launcher:8000
      EXTRA_PAYLOADS_DIR: /payloads
    volumes:
      - ./payloads/sysleak:/payloads:ro
    networks:
      - default
      - kind
    depends_on:
      control-api:
        condition: service_healthy

  launcher:
    build: ./launcher
    environment:
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      MITM_CONTROL_API_URL: http://control-api-mitm-bridge:8000
      KUBECONFIG: /kubeconfig/config
      AGENT_IMAGE_REGISTRY: kind-registry:5000
      PROXY_IMAGE: kind-registry:5000/agent-scanner-proxy:latest
    volumes:
      - ./.kube-kind-config.yaml:/kubeconfig/config:ro
    networks:
      - default
      - kind
    depends_on:
      control-api:
        condition: service_healthy

  scanner-mcp:
    build: ./scanner/mcp
    image: agent-scanner-scanner-mcp:latest
    environment:
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    depends_on:
      control-api:
        condition: service_healthy
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2

  scanner-mcp-cisco-yara:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: cisco_yara
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  scanner-mcp-cisco-readiness:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: cisco_readiness
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  scanner-mcp-cisco-prompt-defense:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: cisco_prompt_defense
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  scanner-mcp-snyk:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: snyk
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      SNYK_TOKEN: ${SNYK_TOKEN:-}
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  scanner-mcp-mcpradar:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: mcpradar
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  scanner-mcp-semgrep:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: semgrep
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  scanner-mcp-mcp-dynamic:
    image: agent-scanner-scanner-mcp:latest
    environment:
      WORKER_ENGINE: mcp_dynamic
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  default: {}
  kind:
    external: true
    name: kind

volumes:
  skill-queue-data:
  control-api-pg-data:
  mitm-dev-ca:
